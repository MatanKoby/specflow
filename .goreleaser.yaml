# GoReleaser config — cross-compiles specflow and publishes a GitHub Release.
# Triggered by a `v*` tag via .github/workflows/release.yml. Docs: https://goreleaser.com
#
# Homebrew tap / Scoop manifest are deferred post-v0.1 (tracked in BUILD_QUEUE.md → Batch G2
# deferred + open-questions.md → Distribution). The `curl … | sh` front-end (install.sh) and
# `go install …@latest` cover v0.1; a `brews:` block slots in here when the tap lands.
version: 2

project_name: specflow

before:
  hooks:
    - go mod tidy

builds:
  - id: specflow
    main: ./cmd/specflow
    binary: specflow
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      # Inject the tag's semver into main.version (overrides the dev default).
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # No Windows/arm64 target for v0.1.
      - goos: windows
        goarch: arm64

archives:
  - id: specflow
    # specflow_0.1.0_linux_amd64.tar.gz  (install.sh depends on this exact shape)
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  # Used by `goreleaser release --snapshot` for local, unpublished test builds.
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc
  filters:
    exclude:
      - "^meta:"
      - "^spec:"
      - "^docs:"

release:
  # A pushed tag PUBLISHES the release directly, archives attached. This was `draft: true`
  # through v0.1.4, which put the release copy in front of the binaries: twice a release was
  # written by hand in the GitHub UI instead, publishing an asset-less release while the real
  # draft sat unpublished, and `install.sh` (which resolves `releases/latest`) 404'd for
  # everyone until someone noticed. A body can be edited after publish; a missing archive
  # breaks installs the moment the tag lands. So the notes are a follow-up edit now, and the
  # human checkpoint moved earlier — see CLAIMS.md → "Releases need the user's approval".
  draft: false
  prerelease: auto
