name: Release

# A pushed semver tag (v0.1.0, v1.2.3, …) cross-compiles via GoReleaser and publishes
# the GitHub Release. Local CI (ci.yml) stays the per-push/PR gate; this runs on tags only.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the release + upload archives

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history so the changelog/version are correct

      - uses: actions/setup-go@v5
        with:
          go-version: "stable"

      # The release body is authored, not generated: `.github/release-notes/<tag>.md` is written in
      # the same commit as the version bump, so it is reviewed in the same diff as the bump rather
      # than edited into the published release afterwards (which needs an API token the agent
      # cutting the release does not have). Its reader is overwhelmingly an agent deciding whether a
      # repo it maintains needs `specflow upgrade` — see spec/architecture.md → Distribution.
      #
      # A missing file falls back to GoReleaser's generated changelog and never fails the job: a
      # release that ships no archives is far worse than one with a plain body.
      - name: Resolve release notes
        id: notes
        run: |
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            echo "args=release --clean --release-notes=$notes" >> "$GITHUB_OUTPUT"
            echo "Using authored release notes: $notes" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "args=release --clean" >> "$GITHUB_OUTPUT"
            echo "⚠ No $notes — falling back to the generated changelog. Write one in the release commit next time." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: ${{ steps.notes.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
